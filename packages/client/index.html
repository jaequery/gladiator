<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Gladiator</title>
    <style>
      :root {
        --ink: #e6edf3;
        --dim: #7d8590;
        --match: #3fb950;
        --mismatch: #f85149;
        --pending: #d29922;
        --panel: rgba(13, 17, 23, 0.82);

        /* The in-match HUD. Read peripherally at speed, so the palette does
           the work a label would: health is warm, armour is cold, and the two
           are never the same hue at any charge level. */
        --health: #f0f6fc;
        --health-low: #e3b341;
        --health-critical: #f85149;
        --armour: #58a6ff;
        --hurt: #ff4a3d;
        --hit: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1117;
        color: var(--ink);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      #app,
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #stage {
        display: block;
        outline: none;
        touch-action: none;
      }

      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .hud-panel {
        position: absolute;
        top: 12px;
        left: 12px;
        min-width: 280px;
        /* Capped, because its widest row is a *value* — an arena name beside
           two hashes, or "MATCH · 1204 compared, 0 mismatched" — and an
           absolutely-positioned box shrink-wraps to whatever that comes to. At
           1024 wide it grew far enough right to sit under the round score, and
           `pnpm run e2e` failed the 4:3 overlap check for it. `overflow-wrap`
           below is what makes a capped width safe. */
        max-width: min(420px, 34vw);
        padding: 10px 14px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: var(--panel);
      }

      .hud-title {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hud-row {
        display: flex;
        gap: 12px;
        justify-content: space-between;
      }

      .hud-label {
        color: var(--dim);
      }

      .hud-value {
        text-align: right;
        overflow-wrap: anywhere;
      }

      .hud-value[data-state='match'] {
        color: var(--match);
      }

      .hud-value[data-state='mismatch'],
      .hud-value[data-state='error'],
      .hud-value[data-state='version-mismatch'],
      .hud-value[data-state='unconfigured'] {
        color: var(--mismatch);
      }

      /* Reconnecting is neither of the two: the session is not working and it
         is not over either, and colouring it red would say a match had ended
         that has not (GLAD-DVDV6P). */
      .hud-value[data-state='reconnecting'] {
        color: var(--pending);
      }

      /* The `?dev=1` performance panel (`ui/devHud.ts`). Top right, which is
         the one corner nothing else uses: diagnostics is top left and the
         in-match readout owns both bottom corners. Deliberately carries no
         `data-hud-box` — it is not on the page unless somebody asked for it,
         so it is not part of the layout the aspect-ratio check measures. */
      .dev-panel {
        position: absolute;
        top: 12px;
        right: 12px;
        min-width: 240px;
        max-width: min(340px, 30vw);
        padding: 10px 14px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: var(--panel);
      }

      .dev-title {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .dev-panel .hud-value[data-state='warn'] {
        color: var(--mismatch);
      }

      .hud-banner {
        position: absolute;
        top: 12px;
        left: 50%;
        max-width: 620px;
        padding: 12px 16px;
        transform: translateX(-50%);
        border: 1px solid var(--mismatch);
        border-radius: 6px;
        background: rgba(248, 81, 73, 0.14);
        color: var(--ink);
        text-align: center;
      }

      /* Clear of the bottom row of the in-match HUD, which is 22px up and
         about 60px tall. At 1024x768 the prompt is wide enough to reach the
         health readout otherwise, which the aspect-ratio check in
         `scripts/e2e.mjs` fails on — as it should. */
      .hud-prompt {
        position: absolute;
        bottom: 118px;
        left: 50%;
        padding: 10px 18px;
        transform: translateX(-50%);
        border: 1px solid #30363d;
        border-radius: 6px;
        background: var(--panel);
        color: var(--dim);
      }

      /* ------------------------------------------------------------------
         The in-match HUD. GLAD-BHNPOE; the markup is
         `packages/client/src/ui/hud.ts`.

         Everything here is positioned against a *corner or an edge* and never
         against another element, so the layout has no reflow to get wrong and
         holds at any aspect ratio — the check in `scripts/e2e.mjs` measures
         all of it at 16:9, 21:9 and 4:3 and fails on an overlap or a box off
         the screen. `vmin` rather than `vw` for anything that scales, because
         a 21:9 window is not a reason for the readout to grow.
         ------------------------------------------------------------------ */

      .hud-match {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* Set by `setVisible`. `display: none` rather than transparency, so a
         hidden element has no box for the overlap check to trip over. */
      [data-visible='no'] {
        display: none !important;
      }

      /* --- top centre: the score ---------------------------------------- */

      .hud-scorebar {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        min-width: 168px;
        padding: 8px 18px 6px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: var(--panel);
        text-align: center;
      }

      .hud-score {
        display: flex;
        gap: 10px;
        justify-content: center;
        font-size: 26px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }

      .hud-score-dash {
        color: var(--dim);
        font-weight: 400;
      }

      .hud-score-them {
        color: var(--dim);
      }

      .hud-headline {
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .hud-target,
      .hud-clock {
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }

      /* --- the middle: the crosshair, and a banner above it -------------- */

      .hud-crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        /* One static filter rather than a dark twin of every line: the
           crosshair has to stay legible against a lit wall and against the
           sky, and a shadow costs one composite of a 64px square. */
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.9));
      }

      .hud-crosshair-marks line {
        stroke: var(--ink);
        stroke-linecap: round;
      }

      .hud-crosshair-dot {
        fill: var(--ink);
      }

      .hud-crosshair-ring {
        fill: none;
        stroke: var(--armour);
        stroke-width: 2;
        stroke-linecap: butt;
        opacity: 0;
      }

      .hud-crosshair-hit line {
        stroke: var(--hit);
        stroke-width: 2.2;
        stroke-linecap: round;
      }

      .hud-crosshair-hit {
        opacity: 0;
      }

      .hud-announce {
        position: absolute;
        top: 24%;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 22px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: var(--panel);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      /* --- bottom left: health and armour -------------------------------- */

      .hud-vitals {
        position: absolute;
        bottom: 22px;
        left: 22px;
        display: flex;
        gap: 22px;
      }

      .hud-vital {
        display: grid;
        grid-template-columns: auto auto;
        gap: 0 8px;
        align-items: baseline;
        min-width: 118px;
      }

      .hud-vital-value {
        font-size: 34px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .hud-vital-tag {
        color: var(--dim);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .hud-bar {
        grid-column: 1 / -1;
        overflow: hidden;
        margin-top: 6px;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: rgba(240, 246, 252, 0.16);
      }

      .hud-bar-wide {
        width: 160px;
      }

      .hud-bar-fill {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: currentcolor;
      }

      .hud-vitals .hud-vital:first-child {
        color: var(--health);
      }

      .hud-vitals .hud-vital + .hud-vital {
        color: var(--armour);
      }

      .hud-vitals[data-state='low'] .hud-vital:first-child {
        color: var(--health-low);
      }

      /* Critical is the one thing on this HUD that moves on its own. It is a
         CSS animation rather than a per-frame opacity write for the reason
         everything else here is guarded: the overlay must not be dirtied by
         JavaScript once a frame just to make something blink. */
      .hud-vitals[data-state='critical'] .hud-vital:first-child {
        color: var(--health-critical);
        animation: hud-pulse 0.7s ease-in-out infinite;
      }

      .hud-vitals[data-state='dead'] {
        opacity: 0.4;
      }

      @keyframes hud-pulse {
        50% {
          opacity: 0.45;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hud-vitals[data-state='critical'] .hud-vital:first-child {
          animation: none;
        }
      }

      /* --- bottom right: the weapon and its wait ------------------------- */

      .hud-weapon {
        position: absolute;
        right: 22px;
        bottom: 22px;
        text-align: right;
        color: var(--armour);
      }

      .hud-weapon-name {
        color: var(--ink);
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .hud-weapon .hud-bar {
        margin-left: auto;
      }

      .hud-weapon-cooldown {
        margin-top: 4px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
      }

      .hud-weapon[data-state='ready'] .hud-weapon-cooldown {
        color: var(--match);
      }

      /* --- everywhere: what just hit you --------------------------------- */

      /* Both cover the whole viewport by design and are excluded from the
         overlap rule for that reason — they are light, not layout. */
      .hud-hurt,
      .hud-damage {
        position: absolute;
        inset: 0;
        opacity: 0;
      }

      .hud-hurt {
        background: radial-gradient(
          ellipse at center,
          rgba(255, 74, 61, 0) 42%,
          rgba(255, 74, 61, 0.45) 100%
        );
      }

      /* A dial the size of the screen's short side, rotated so that the arc
         at the top of it ends up pointing at whatever hit you. */
      .hud-damage-dial {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 46vmin;
        height: 46vmin;
        transform: translate(-50%, -50%);
      }

      .hud-damage-arc {
        position: absolute;
        top: 0;
        left: 50%;
        width: 26%;
        height: 12%;
        transform: translateX(-50%);
        border-top: 4px solid var(--hurt);
        border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      }

      /* ------------------------------------------------------------------
         The menus. GLAD-NPCTU8; the markup is
         `packages/client/src/ui/menu.ts` and the bounce page is
         `ui/unsupported.ts`.

         Two things are load-bearing rather than decorative. `pointer-events`
         is turned back on, because these are the overlays a player is meant to
         click — the rest of the overlay must stay transparent to the mouse or
         the canvas never gets the click that locks the pointer. And nothing in
         here carries `data-hud-box`: the aspect-ratio check in
         `scripts/e2e.mjs` measures those for overlap, and a full-screen menu
         legitimately covers everything.
         ------------------------------------------------------------------ */

      #menu,
      #bounce {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        overflow-y: auto;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(13, 17, 23, 0.88);
        pointer-events: auto;
      }

      #menu[hidden],
      #bounce[hidden] {
        display: none;
      }

      #bounce {
        flex-direction: column;
        max-width: 640px;
        margin: 0 auto;
        text-align: center;
      }

      .menu-screen {
        width: min(460px, 100%);
        padding: 22px 24px 24px;
        border: 1px solid #30363d;
        border-radius: 8px;
        background: var(--panel);
      }

      .menu-screen[hidden] {
        display: none;
      }

      .menu-heading,
      .bounce-title {
        margin: 0 0 10px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .menu-lede,
      .menu-body,
      .bounce-body {
        margin: 0 0 16px;
        color: var(--ink);
        line-height: 1.6;
      }

      .menu-hint {
        margin: -8px 0 14px;
        color: var(--dim);
        min-height: 1.5em;
      }

      /* The raw-input fallback warning. Amber rather than red: the game is
         entirely playable like this, and the player is being told that one
         number means something slightly different than it says. */
      .menu-warning {
        margin: 0 0 16px;
        padding: 10px 12px;
        border: 1px solid #9e6a03;
        border-radius: 6px;
        background: rgba(187, 128, 9, 0.12);
        color: var(--health-low);
        line-height: 1.5;
      }

      .menu-warning[hidden] {
        display: none;
      }

      .menu-button {
        display: block;
        width: 100%;
        margin: 0 0 8px;
        padding: 11px 14px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: #161b22;
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .menu-button:hover:not(:disabled),
      .menu-button:focus-visible {
        border-color: var(--armour);
        outline: none;
      }

      .menu-button:disabled {
        color: var(--dim);
        cursor: default;
      }

      .menu-footer {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .menu-footer .menu-button {
        margin: 0;
        color: var(--dim);
        text-align: center;
      }

      /* The room code. The one thing on the page a player reads out loud, so
         it is the biggest thing on it. */
      .menu-code,
      .bounce-code {
        margin: 0 0 8px;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-align: center;
      }

      .menu-link-row,
      .bounce-row {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }

      .menu-link,
      .menu-code-input,
      .bounce-link {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: #0d1117;
        color: var(--ink);
        font: inherit;
      }

      .menu-code-input {
        margin-bottom: 10px;
        font-size: 22px;
        letter-spacing: 0.2em;
        text-align: center;
        text-transform: uppercase;
      }

      .menu-link-row .menu-button,
      .bounce-row .bounce-copy {
        width: auto;
        margin: 0;
        white-space: nowrap;
      }

      .menu-button[data-state='copied'] {
        border-color: var(--match);
        color: var(--match);
      }

      .menu-field {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 10px;
        margin-bottom: 14px;
        align-items: center;
      }

      .menu-field-label {
        grid-column: 1 / -1;
        color: var(--dim);
      }

      .menu-range {
        width: 100%;
        accent-color: var(--armour);
      }

      .menu-number {
        width: 84px;
        padding: 6px 8px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: #0d1117;
        color: var(--ink);
        font: inherit;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .menu-check {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
        color: var(--dim);
      }

      .bounce-copy,
      .bounce-anyway {
        padding: 10px 14px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: #161b22;
        color: var(--ink);
        font: inherit;
        cursor: pointer;
      }

      .bounce-anyway {
        color: var(--dim);
      }

      /* The quick-match panel. Centred low, where a loading line goes and
         where nothing else on the overlay is: the diagnostics panel is top
         left, the score top centre and the vitals bottom left, and a player
         waiting for a stranger is looking at the middle of an empty arena. */
      .queue-panel {
        position: absolute;
        left: 50%;
        bottom: 18%;
        transform: translateX(-50%);
        min-width: 280px;
        max-width: min(420px, 60vw);
        padding: 12px 16px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: var(--panel);
        text-align: center;
      }

      .queue-panel[hidden] {
        display: none;
      }

      .queue-headline {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .queue-detail {
        margin: 0;
        color: var(--dim);
      }

      /* The wait, drawn. A bar rather than a spinner on purpose: a spinner says
         "something is happening" and this has to say "for this much longer". */
      .queue-track {
        margin-top: 10px;
        height: 3px;
        border-radius: 2px;
        background: #30363d;
        overflow: hidden;
      }

      .queue-bar {
        height: 100%;
        width: 0;
        background: var(--armour);
      }

      /* Both ways a wait can end read as an answer rather than as a failure. */
      .queue-panel[data-queue='matched'] .queue-bar {
        background: var(--match);
      }

      .queue-panel[data-queue='timeout'] .queue-bar {
        background: var(--health-low);
      }

      /* The credits screen. `pointer-events` is turned back on because it is
         the one overlay a player is meant to click: every entry links to where
         the asset came from. Above the menu, because it opens from it. */
      #credits {
        position: absolute;
        inset: 0;
        z-index: 10;
        overflow-y: auto;
        padding: 48px 24px;
        background: rgba(13, 17, 23, 0.94);
        pointer-events: auto;
      }

      #credits[hidden] {
        display: none;
      }

      /* The way out of a panel that covers the whole page, drawn above
         everything the panel has to fetch. `src/credits.ts` argues why it is
         not allowed to be a keyboard shortcut alone (GLAD-G42FEB). */
      .credits-bar {
        display: flex;
        margin: 0 auto 16px;
        max-width: 720px;
        justify-content: flex-end;
      }

      .credits-close-button {
        width: auto;
        margin: 0;
        padding: 6px 18px;
        text-align: center;
      }

      .credits-title {
        margin: 0 auto 4px;
        max-width: 720px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .credits-preamble,
      .credits-close {
        margin: 0 auto 24px;
        max-width: 720px;
        color: var(--dim);
      }

      .credits-section {
        margin: 0 auto 24px;
        max-width: 720px;
      }

      .credits-section h2 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .credits-row {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding: 3px 0;
        border-bottom: 1px solid #21262d;
      }

      .credits-name {
        color: var(--ink);
      }

      .credits-author,
      .credits-licence {
        color: var(--dim);
        text-align: right;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
