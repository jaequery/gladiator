<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Gladiator</title>
    <style>
      :root {
        --ink: #e6edf3;
        --dim: #7d8590;
        --match: #3fb950;
        --mismatch: #f85149;
        --panel: rgba(13, 17, 23, 0.82);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1117;
        color: var(--ink);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      #app,
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #stage {
        display: block;
        outline: none;
        touch-action: none;
      }

      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .hud-panel {
        position: absolute;
        top: 12px;
        left: 12px;
        min-width: 340px;
        padding: 10px 14px;
        border: 1px solid #30363d;
        border-radius: 6px;
        background: var(--panel);
      }

      .hud-title {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hud-row {
        display: flex;
        gap: 12px;
        justify-content: space-between;
      }

      .hud-label {
        color: var(--dim);
      }

      .hud-value {
        text-align: right;
        overflow-wrap: anywhere;
      }

      .hud-value[data-state='match'] {
        color: var(--match);
      }

      .hud-value[data-state='mismatch'],
      .hud-value[data-state='error'],
      .hud-value[data-state='version-mismatch'],
      .hud-value[data-state='unconfigured'] {
        color: var(--mismatch);
      }

      .hud-banner {
        position: absolute;
        top: 12px;
        left: 50%;
        max-width: 620px;
        padding: 12px 16px;
        transform: translateX(-50%);
        border: 1px solid var(--mismatch);
        border-radius: 6px;
        background: rgba(248, 81, 73, 0.14);
        color: var(--ink);
        text-align: center;
      }

      .hud-prompt {
        position: absolute;
        bottom: 40px;
        left: 50%;
        padding: 10px 18px;
        transform: translateX(-50%);
        border: 1px solid #30363d;
        border-radius: 6px;
        background: var(--panel);
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
